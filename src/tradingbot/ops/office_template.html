<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Agent Office - Open-Plan Trading Floor</title>
  <style>
    :root {
      --bg: #070b16;
      --panel: rgba(10, 16, 30, 0.88);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --active: #34d399;
      --idle: #38bdf8;
      --warning: #fbbf24;
      --error: #f87171;
      --offline: #64748b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    .panel {
      position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    #titlePanel { top: 18px; left: 18px; padding: 18px 20px; max-width: 460px; }
    #titlePanel h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    #titlePanel .sub { margin-top: 6px; color: var(--muted); font-size: 12px; }
    #titlePanel .stamp { margin-top: 9px; color: #64748b; font-size: 11px; }
    #floorTag { margin-top: 12px; color: #cbd5e1; font-size: 12px; font-weight: 600; }
    #floorTag span { color: var(--muted); font-weight: 400; }
    #squads { margin-top: 8px; color: #94a3b8; font-size: 10px; line-height: 1.7; }
    #squads b { color: #e2e8f0; font-weight: 600; }
    #competition { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 11px; }
    #competition .team { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; color: #cbd5e1; }
    #competition .team b { color: #fff; }
    #competition .leader { color: var(--active); font-weight: 700; }
    .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .pill { font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .pill b { color: var(--text); font-weight: 600; }
    #controls { top: 18px; right: 18px; display: flex; gap: 8px; padding: 8px; }
    button {
      border: 1px solid var(--line); background: rgba(30, 41, 59, 0.7); color: var(--text);
      border-radius: 10px; padding: 8px 11px; font-size: 11px; cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover { background: rgba(51, 65, 85, 0.9); border-color: rgba(148,163,184,.4); }
    #info {
      top: 88px; right: 18px; width: 350px; padding: 18px;
      transform: translateX(390px); opacity: 0; pointer-events: none;
      transition: transform .22s ease, opacity .22s ease;
    }
    #info.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
    #info .close { position: absolute; top: 12px; right: 12px; padding: 4px 8px; }
    #info .role { color: var(--muted); font-size: 12px; margin-top: 3px; }
    #info .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    #info .metric { font-size: 28px; font-weight: 700; margin-top: 14px; letter-spacing: -.03em; }
    #info .detail { color: var(--muted); font-size: 12px; line-height: 1.55; margin-top: 8px; }
    #info .speech { margin-top: 14px; padding: 10px 12px; border-left: 2px solid var(--line); color: #cbd5e1; font-size: 12px; line-height: 1.5; }
    #info .kv { display: grid; grid-template-columns: 1fr auto; gap: 7px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; }
    #info .kv span:nth-child(odd) { color: var(--muted); }
    #info .kv span:nth-child(even) { color: var(--text); text-align: right; }
    #info .spark { width: 100%; height: 64px; margin-top: 12px; border-radius: 8px; background: rgba(15,23,42,.7); }
    #legend { left: 18px; bottom: 18px; padding: 12px 14px; display: flex; gap: 14px; align-items: center; font-size: 11px; color: var(--muted); }
    #legend .item { display: flex; align-items: center; gap: 6px; }
    #hint { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 12px; font-size: 11px; color: var(--muted); white-space: nowrap; }
    #floorNav { left: 50%; bottom: 58px; transform: translateX(-50%); display: flex; gap: 6px; padding: 7px; }
    #floorNav button.active { background: rgba(56, 189, 248, .18); border-color: rgba(56,189,248,.7); color: #e0f2fe; }
    #error { display: none; position: fixed; inset: 0; z-index: 30; place-items: center; background: var(--bg); padding: 32px; text-align: center; }
    #error.show { display: grid; }
    #error h2 { color: var(--error); }
    #error code { color: #fbbf24; }
    @media (max-width: 760px) {
      #info { width: calc(100vw - 36px); right: 18px; top: 150px; }
      #titlePanel { max-width: calc(100vw - 36px); }
      #floorNav { bottom: 54px; max-width: calc(100vw - 36px); overflow-x: auto; }
      #hint { display: none; }
      #legend { flex-wrap: wrap; max-width: calc(100vw - 36px); }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="titlePanel" class="panel">
    <h1 id="title">The Agent Office</h1>
    <div class="sub" id="subtitle">A paper-trading floor</div>
    <div class="stamp" id="stamp"></div>
    <div id="environment" style="margin-top:7px;color:#cbd5e1;font-size:11px;"></div>
    <div id="floorTag"></div>
    <div id="squads"></div>
    <div id="competition"></div>
    <div class="pills" id="pills"></div>
  </div>

  <div id="controls" class="panel">
    <button id="toggleOrbit">Start orbit</button>
    <button id="toggleLabels">Hide labels</button>
    <button id="toggleWeather">Weather: Auto</button>
    <button id="resetView">Reset view</button>
  </div>

  <div id="floorNav" class="panel"></div>

  <div id="info" class="panel">
    <button class="close" id="closeInfo">✕</button>
    <div id="infoName" style="font-size:20px;font-weight:700;"></div>
    <div id="infoRole" class="role"></div>
    <div class="status"><span id="infoDot" class="dot"></span><span id="infoStatus"></span></div>
    <div id="infoMetric" class="metric"></div>
    <div id="infoDetail" class="detail"></div>
    <div id="infoSpeech" class="speech"></div>
    <canvas id="infoSpark" class="spark" width="600" height="128"></canvas>
    <div class="kv" id="infoKv"></div>
  </div>

  <div id="legend" class="panel">
    <span class="item"><span class="dot" style="background:var(--active)"></span> active</span>
    <span class="item"><span class="dot" style="background:var(--idle)"></span> idle</span>
    <span class="item"><span class="dot" style="background:var(--warning)"></span> warning</span>
    <span class="item"><span class="dot" style="background:var(--error)"></span> error</span>
    <span class="item"><span class="dot" style="background:var(--offline)"></span> offline</span>
  </div>
  <div id="hint" class="panel">drag to orbit · scroll to zoom · click a person · hide labels for a clean view</div>
  <div id="error"><div><h2>3D engine failed to load</h2><p id="errorText">Check the browser console.</p></div></div>

  <script>
__THREE_JS__
  </script>
  <script>
__ORBIT_JS__
  </script>
  <script>
(() => {
  "use strict";
  const DATA = __OFFICE_DATA__;
  const COLORS = {
    active: "#34d399", idle: "#38bdf8", warning: "#fbbf24",
    error: "#f87171", offline: "#64748b",
  };
  if (!window.THREE || !THREE.OrbitControls) {
    document.getElementById("error").classList.add("show");
    document.getElementById("errorText").innerHTML =
      "The local Three.js bundle did not load. Rebuild with <code>scripts/build_office3d.py</code>.";
    return;
  }

  const app = document.getElementById("app");
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdcefff);
  scene.fog = new THREE.Fog(0xdcefff, 105, 235);

  const FLOOR_SCALE = 1.5;
  const BASE_FLOOR_WIDTH = 34;
  const BASE_FLOOR_DEPTH = 24;
  const FLOOR_WIDTH = BASE_FLOOR_WIDTH * FLOOR_SCALE;
  const FLOOR_DEPTH = BASE_FLOOR_DEPTH * FLOOR_SCALE;
  const LAYOUT_SCALE = FLOOR_SCALE;
  const FLOOR_GAP = 7;
  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(0, 9.5, 25);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  app.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2, 0.8);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 10;
  controls.maxDistance = 42;
  controls.maxPolarAngle = Math.PI / 2.04;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.25;

  const hemi = new THREE.HemisphereLight(0xffffff, 0xc9a77c, 0.9);
  scene.add(hemi);
  const ambient = new THREE.AmbientLight(0xffffff, 0.28);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff1d2, 1.65);
  sun.position.set(-17, 30, -20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -32;
  sun.shadow.camera.right = 32;
  sun.shadow.camera.top = 30;
  sun.shadow.camera.bottom = -26;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 140;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xbfe3ff, 0.46);
  fill.position.set(65, 55, 80);
  scene.add(fill);
  const allLight = new THREE.DirectionalLight(0xffffff, 1.2);
  allLight.position.set(0, 90, 45);
  allLight.visible = false;
  scene.add(allLight);

  function mat(color, opts = {}) {
    return new THREE.MeshStandardMaterial({
      color, roughness: opts.roughness ?? 0.68, metalness: opts.metalness ?? 0.05,
      emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.emissiveIntensity ?? 0.0,
      transparent: opts.transparent ?? false, opacity: opts.opacity ?? 1.0,
      side: opts.side ?? THREE.FrontSide,
    });
  }
  function box(w, h, d, color, x, y, z, opts = {}) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
    mesh.position.set(x, y, z);
    mesh.castShadow = opts.castShadow ?? true;
    mesh.receiveShadow = opts.receiveShadow ?? true;
    return mesh;
  }
  function cylinder(rt, rb, h, color, x, y, z, opts = {}) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, opts.segments ?? 16), mat(color, opts));
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }
  function statusColor(status) { return COLORS[status] || COLORS.offline; }

  function makeScreenTexture(agent) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 320;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0b1220"; ctx.fillRect(0, 0, 512, 320);
    ctx.strokeStyle = statusColor(agent.status); ctx.lineWidth = 5; ctx.strokeRect(10, 10, 492, 300);
    ctx.fillStyle = statusColor(agent.status); ctx.beginPath(); ctx.arc(42, 46, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e2e8f0"; ctx.font = "bold 30px Inter, sans-serif"; ctx.fillText(agent.role, 64, 55);
    ctx.fillStyle = "#94a3b8"; ctx.font = "22px Inter, sans-serif"; ctx.fillText(agent.metric, 34, 105);
    ctx.fillStyle = "#64748b"; ctx.font = "18px Inter, sans-serif"; ctx.fillText(String(agent.detail).slice(0, 46), 34, 140);
    const values = agent.spark && agent.spark.length > 1 ? agent.spark : [1, 1];
    let min = Math.min(...values), max = Math.max(...values);
    if (max - min < 1e-9) { min -= 0.5; max += 0.5; }
    ctx.strokeStyle = agent.accent; ctx.lineWidth = 3; ctx.beginPath();
    values.forEach((v, i) => {
      const x = 34 + (i / Math.max(1, values.length - 1)) * 444;
      const y = 285 - ((v - min) / (max - min)) * 105;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.fillStyle = "#475569"; ctx.font = "16px Inter, sans-serif"; ctx.fillText("PAPER ACCOUNT", 34, 305);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeLabel(agent) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 180;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 512, 180);
    ctx.fillStyle = "rgba(8, 14, 26, 0.9)";
    ctx.strokeStyle = statusColor(agent.status); ctx.lineWidth = 3;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(6, 6, 500, 168, 20); else ctx.rect(6, 6, 500, 168);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = statusColor(agent.status); ctx.beginPath(); ctx.arc(38, 46, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f8fafc"; ctx.font = "bold 36px Inter, sans-serif"; ctx.fillText(agent.name, 60, 57);
    ctx.fillStyle = "#cbd5e1"; ctx.font = "22px Inter, sans-serif"; ctx.fillText(agent.role, 32, 98);
    ctx.fillStyle = agent.accent; ctx.font = "bold 24px Inter, sans-serif"; ctx.fillText(agent.metric, 32, 137);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    sprite.scale.set(3.1, 1.08, 1);
    return sprite;
  }

  function makeRoomLabel(title, subtitle, x, _y, z, color) {
    const cssColor = typeof color === "number" ? `#${color.toString(16).padStart(6, "0")}` : color;
    const c = document.createElement("canvas"); c.width = 640; c.height = 160;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 640, 160);
    ctx.fillStyle = "rgba(7, 13, 25, 0.88)";
    ctx.strokeStyle = cssColor; ctx.lineWidth = 4;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(4, 4, 632, 152, 18); else ctx.rect(4, 4, 632, 152);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = cssColor; ctx.font = "bold 44px Inter, sans-serif"; ctx.fillText(title, 28, 66);
    ctx.fillStyle = "#94a3b8"; ctx.font = "22px Inter, sans-serif"; ctx.fillText(subtitle, 28, 108);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(4.4, 1.1),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.rotation.z = 0;
    mesh.position.set(x, 0.135, z);
    return mesh;
  }

  function createPerson(agent) {
    const standing = !!agent.standing;
    const g = new THREE.Group();
    const shirt = new THREE.MeshStandardMaterial({ color: new THREE.Color(agent.shirt), roughness: 0.7 });
    const skin = new THREE.MeshStandardMaterial({ color: new THREE.Color(agent.skin), roughness: 0.8 });
    const hair = new THREE.MeshStandardMaterial({ color: new THREE.Color(agent.hair), roughness: 0.95 });
    const bodyY = standing ? 1.12 : 0.92;
    const headY = standing ? 1.93 : 1.62;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, standing ? 0.95 : 0.72, 16), shirt);
    body.position.y = bodyY; body.castShadow = true; g.add(body);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.14, 12), skin);
    neck.position.y = headY - 0.23; g.add(neck);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 24, 18), skin);
    head.position.y = headY; head.castShadow = true; g.add(head);
    const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 12), hair);
    hairMesh.scale.set(1.03, 0.62, 1.03); hairMesh.position.set(0, headY + 0.1, -0.035); g.add(hairMesh);
    for (const ex of [-0.085, 0.085]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), mat(0x0b1220, { roughness: 0.3 }));
      eye.position.set(ex, headY + 0.03, 0.225); g.add(eye);
    }
    const armGeo = new THREE.CylinderGeometry(0.06, 0.07, 0.52, 10);
    const armL = new THREE.Mesh(armGeo, shirt); armL.position.set(-0.34, bodyY + 0.04, 0.24); armL.rotation.set(-1.0, 0, -0.25); g.add(armL);
    const armR = new THREE.Mesh(armGeo, shirt); armR.position.set(0.34, bodyY + 0.04, 0.24); armR.rotation.set(-1.0, 0, 0.25); g.add(armR);
    for (const [x, arm] of [[-0.34, armL], [0.34, armR]]) {
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 8), skin);
      hand.position.set(x, arm.position.y - 0.27, arm.position.z + 0.02); g.add(hand);
    }
    const legGeo = new THREE.CylinderGeometry(0.085, 0.09, 0.74, 10);
    const legL = new THREE.Mesh(legGeo, mat(0x1e293b));
    legL.position.set(-0.18, 0.4, 0.02); legL.castShadow = true; g.add(legL);
    const legR = new THREE.Mesh(legGeo, mat(0x1e293b));
    legR.position.set(0.18, 0.4, 0.02); legR.castShadow = true; g.add(legR);
    if (agent.headset) {
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.018, 8, 24, Math.PI), mat(0x67e8f9, { emissive: 0x0891b2, emissiveIntensity: 0.6 }));
      band.position.set(0, headY + 0.11, 0.03); band.rotation.x = Math.PI / 2; g.add(band);
      const mic = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.2, 0.035), mat(0x67e8f9, { emissive: 0x0891b2, emissiveIntensity: 0.8 }));
      mic.position.set(0.21, headY - 0.06, 0.17); g.add(mic);
    }
    if (agent.badge) {
      const badge = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.02, 16), mat(0xfacc15, { emissive: 0xca8a04, emissiveIntensity: 0.5 }));
      badge.rotation.x = Math.PI / 2; badge.position.set(0.2, bodyY + 0.15, 0.32); g.add(badge);
    }
    if (agent.clipboard) {
      const clip = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.38, 0.03), mat(0xe2e8f0));
      clip.position.set(-0.44, bodyY - 0.03, 0.36); clip.rotation.z = -0.25; g.add(clip);
    }
    return { group: g, head, armL, armR, legL, legR, headY };
  }

  const agentObjects = [];
  const agentGroups = [];
  const byId = Object.fromEntries(DATA.agents.map((a) => [a.id, a]));

  function createDesk(agent, parent, x, z) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.add(box(2.7, 0.12, 1.25, 0x9a6b4f, 0, 1.0, 0.3, { metalness: 0.05, roughness: 0.62 }));
    for (const lx of [-1.1, 1.1]) for (const lz of [-0.12, 0.72]) {
      g.add(box(0.09, 0.98, 0.09, 0x1e293b, lx, 0.5, lz, { metalness: 0.4 }));
    }
    g.add(box(2.3, 0.035, 0.1, new THREE.Color(agent.accent).getHex(), 0, 1.07, 0.93, {
      emissive: new THREE.Color(agent.accent).getHex(), emissiveIntensity: 0.5, castShadow: false
    }));
    const monitor = new THREE.Group(); monitor.position.set(0, 1.55, 0.55);
    monitor.add(box(1.38, 0.84, 0.07, 0x0b1220, 0, 0, 0, { metalness: 0.5, roughness: 0.3 }));
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 0.72), new THREE.MeshBasicMaterial({ map: makeScreenTexture(agent) }));
    screen.position.set(0, 0, 0.041); monitor.add(screen);
    monitor.add(box(0.08, 0.42, 0.08, 0x1e293b, 0, -0.58, -0.02, { metalness: 0.5 }));
    monitor.add(box(0.58, 0.04, 0.32, 0x1e293b, 0, -0.79, -0.02, { metalness: 0.5 }));
    monitor.rotation.y = -0.08; g.add(monitor);
    g.add(box(1.16, 0.04, 0.34, 0x111827, 0, 1.09, 0.2));
    for (let i = 0; i < 3; i++) for (let j = 0; j < 9; j++) {
      g.add(box(0.07, 0.018, 0.055, 0x334155, -0.48 + j * 0.12, 1.115, 0.13 + i * 0.09, { castShadow: false }));
    }
    g.add(cylinder(0.08, 0.07, 0.13, 0x94a3b8, 0.94, 1.12, 0.32, { metalness: 0.2 }));
    const chair = new THREE.Group(); chair.position.set(0, 0, -0.95);
    chair.add(box(0.72, 0.1, 0.72, new THREE.Color(agent.accent).getHex(), 0, 0.58, 0));
    chair.add(box(0.72, 1.1, 0.1, new THREE.Color(agent.accent).getHex(), 0, 1.1, -0.34));
    chair.add(box(0.08, 0.55, 0.08, 0x334155, 0, 0.27, 0, { metalness: 0.4 }));
    g.add(chair);
    const person = createPerson(agent);
    person.group.position.set(x, 0, z - 0.86);
    parent.add(person.group);
    const label = makeLabel(agent); label.position.set(0, agent.standing ? 3.5 : 3.1, 0); person.group.add(label);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.68, 32), new THREE.MeshBasicMaterial({
      color: statusColor(agent.status), transparent: true, opacity: 0.8, side: THREE.DoubleSide
    }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(0, 0.14, 0); person.group.add(ring);

  const skyCache = {};
  function makeSkyTexture(phase = "day", weather = "sunny") {
    const cacheKey = phase + ":" + weather;
    if (skyCache[cacheKey]) return skyCache[cacheKey];
    const c = document.createElement("canvas"); c.width = 512; c.height = 512;
    const ctx = c.getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    if (phase === "night") {
      grad.addColorStop(0, "#050b1e"); grad.addColorStop(0.6, "#0d1b3b"); grad.addColorStop(1, "#223056");
    } else if (phase === "dusk" || phase === "dawn") {
      grad.addColorStop(0, phase === "dawn" ? "#7aa8d8" : "#6f86c9");
      grad.addColorStop(0.5, phase === "dawn" ? "#f8d3a3" : "#f4a07c");
      grad.addColorStop(1, "#ffe8c7");
    } else {
      grad.addColorStop(0, weather === "rain" ? "#64748b" : "#4da3e8");
      grad.addColorStop(0.55, weather === "rain" ? "#94a3b8" : "#9fd6ff");
      grad.addColorStop(1, weather === "rain" ? "#cbd5e1" : "#e3f4ff");
    }
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 512);
    if (phase === "night") {
      ctx.fillStyle = "rgba(255,255,255,.9)";
      for (let i = 0; i < 42; i++) {
        const x = (i * 97) % 512, y = (i * 53) % 250, r = i % 5 === 0 ? 1.6 : 0.8;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,222,140,.9)";
      ctx.beginPath(); ctx.arc(390, 92, 24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(10,18,40,.8)";
      for (let i = 0; i < 16; i++) {
        const h = 18 + (i * 31) % 80;
        ctx.fillRect(20 + i * 31, 512 - h, 22, h);
      }
    } else {
      ctx.fillStyle = weather === "rain" ? "rgba(71,85,105,.88)" : "rgba(255,255,255,0.78)";
      for (const [x, y, r] of [[100, 120, 42], [150, 112, 32], [210, 128, 25], [360, 210, 40], [405, 202, 28]]) {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath(); ctx.ellipse(330, 108, 82, 18, 0, 0, Math.PI * 2); ctx.fill();
      if (phase === "dusk" || phase === "dawn") {
        ctx.fillStyle = "rgba(255,190,120,.28)";
        ctx.beginPath(); ctx.arc(380, 140, 76, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (weather === "rain") {
      ctx.strokeStyle = "rgba(226,232,240,.5)"; ctx.lineWidth = 2;
      for (let i = 0; i < 28; i++) {
        const x = (i * 71 + 17) % 512, y = (i * 43 + 20) % 430;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 9, y + 28); ctx.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    skyCache[cacheKey] = tex;
    return tex;
  }

  function makeWoodTexture() {
    const c = document.createElement("canvas"); c.width = 512; c.height = 512;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#b98758"; ctx.fillRect(0, 0, 512, 512);
    for (let row = 0; row < 8; row++) {
      const y = row * 64;
      const shade = 180 + ((row * 37) % 24);
      ctx.fillStyle = `rgb(${shade}, ${shade - 42}, ${shade - 76})`;
      ctx.fillRect(0, y + 2, 512, 60);
      ctx.strokeStyle = "rgba(80, 45, 25, 0.24)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      for (let g = 0; g < 9; g++) {
        ctx.strokeStyle = `rgba(90, 55, 30, ${0.06 + (g % 3) * 0.025})`;
        ctx.beginPath();
        const gy = y + 8 + g * 6;
        ctx.moveTo(0, gy);
        ctx.bezierCurveTo(140, gy + (g % 2 ? 2 : -2), 360, gy + (g % 2 ? -2 : 3), 512, gy);
        ctx.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(11, 8); tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeSign(text, x, y, z, color) {
    const cssColor = typeof color === "number" ? `#${color.toString(16).padStart(6, "0")}` : color;
    const c = document.createElement("canvas"); c.width = 512; c.height = 120;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 512, 120);
    ctx.fillStyle = "rgba(7, 13, 25, 0.92)";
    ctx.strokeStyle = cssColor; ctx.lineWidth = 4;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(4, 4, 504, 112, 16); else ctx.rect(4, 4, 504, 112);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = cssColor; ctx.font = "bold 42px Inter, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(text, 256, 74);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    sprite.scale.set(2.6, 0.61, 1); sprite.position.set(x, y, z); return sprite;

  function glassRoom(parent, x0, z0, x1, z1, color, frosted, label) {
    const w = x1 - x0, d = z1 - z0;
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    const opacity = frosted ? 0.62 : 0.20;
    const glass = new THREE.MeshStandardMaterial({
      color: 0x93c5fd, transparent: true, opacity, roughness: 0.15, metalness: 0.1,
      side: THREE.DoubleSide,
    });
    const frame = mat(0x94a3b8, { metalness: 0.55, roughness: 0.3 });
    const h = 2.45;
    const room = new THREE.Group();
    room.position.set(cx, 0, cz);
    parent.add(room);
    room.userData.structural = true;
    function wall(width, depth, x, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, h, depth), glass);
      mesh.position.set(x, h / 2, z); mesh.castShadow = false; mesh.receiveShadow = false; room.add(mesh);
      const top = new THREE.Mesh(new THREE.BoxGeometry(width + 0.06, 0.06, depth + 0.06), frame);
      top.position.set(x, h + 0.03, z); room.add(top);
    }
    wall(w, 0.12, 0, z0 - cz);
    wall(0.12, d, x0 - cx, 0);
    wall(0.12, d, x1 - cx, 0);
    const door = 1.25;
    wall((w - door) / 2, 0.12, x0 - cx + (w - door) / 4, z1 - cz);
    wall((w - door) / 2, 0.12, x1 - cx - (w - door) / 4, z1 - cz);
    for (const dx of [-door / 2, door / 2]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.07, h, 0.07), frame);
      post.position.set(dx, h / 2, z1 - cz); room.add(post);
    }
    room.add(makeSign(label, 0, h + 0.5, z1 - cz + 0.08, color));
  }

  function makeDataScreen(title, subtitle, color = 0x38bdf8) {
    const css = `#${color.toString(16).padStart(6, "0")}`;
    const c = document.createElement("canvas"); c.width = 640; c.height = 360;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#07111f"; ctx.fillRect(0, 0, 640, 360);
    ctx.strokeStyle = css; ctx.lineWidth = 5; ctx.strokeRect(12, 12, 616, 336);
    ctx.fillStyle = css; ctx.font = "bold 34px Inter, sans-serif"; ctx.fillText(title, 36, 62);
    ctx.fillStyle = "#94a3b8"; ctx.font = "22px Inter, sans-serif"; ctx.fillText(subtitle, 36, 104);
    ctx.strokeStyle = "rgba(56,189,248,.35)"; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(36, 155 + i * 30); ctx.lineTo(604, 155 + i * 30); ctx.stroke(); }
    ctx.strokeStyle = css; ctx.lineWidth = 5; ctx.beginPath();
    for (let i = 0; i < 18; i++) {
      const x = 36 + i * 33;
      const y = 270 - Math.sin(i * 0.8) * 42 - i * 3;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; return tex;
  }

  function partitionWall(parent, x1, z1, x2, z2, accent = 0x94a3b8, doorCenter = null, doorWidth = 3.0) {
    const horizontal = Math.abs(x2 - x1) >= Math.abs(z2 - z1);
    const min = horizontal ? Math.min(x1, x2) : Math.min(z1, z2);
    const max = horizontal ? Math.max(x1, x2) : Math.max(z1, z2);
    const fixed = horizontal ? z1 : x1;
    const h = 2.55;
    const lowerH = 1.05;
    const glass = new THREE.MeshStandardMaterial({
      color: 0xbfe3ff, transparent: true, opacity: 0.24, roughness: 0.12, metalness: 0.08, side: THREE.DoubleSide,
    });
    const solid = mat(0xe8eef5, { roughness: 0.75 });
    const frame = mat(0x94a3b8, { metalness: 0.45, roughness: 0.32 });
    const spans = [];
    if (doorCenter == null) spans.push([min, max]);
    else {
      const dc = Math.max(min + 0.4, Math.min(max - 0.4, doorCenter));
      const half = doorWidth / 2;
      if (dc - half > min + 0.08) spans.push([min, dc - half]);
      if (dc + half < max - 0.08) spans.push([dc + half, max]);
    }
    for (const [a, b] of spans) {
      const len = b - a;
      if (len < 0.08) continue;
      const cx = horizontal ? (a + b) / 2 : fixed;
      const cz = horizontal ? fixed : (a + b) / 2;
      const lower = new THREE.Mesh(new THREE.BoxGeometry(horizontal ? len : 0.16, lowerH, horizontal ? 0.16 : len), solid);
      lower.position.set(cx, lowerH / 2, cz); lower.castShadow = false; lower.receiveShadow = true; parent.add(lower);
      const upper = new THREE.Mesh(new THREE.BoxGeometry(horizontal ? len : 0.1, h - lowerH, horizontal ? 0.1 : len), glass);
      upper.position.set(cx, lowerH + (h - lowerH) / 2, cz); upper.castShadow = false; parent.add(upper);
      const top = new THREE.Mesh(new THREE.BoxGeometry(horizontal ? len + 0.06 : 0.14, 0.06, horizontal ? 0.14 : len + 0.06), frame);
      top.position.set(cx, h + 0.03, cz); parent.add(top);
    }
    if (doorCenter != null) {
      const half = doorWidth / 2;
      for (const side of [-half, half]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(horizontal ? 0.08 : 0.12, h + 0.1, horizontal ? 0.12 : 0.08), frame);
        post.position.set(horizontal ? doorCenter + side : fixed, (h + 0.1) / 2, horizontal ? fixed : doorCenter + side);
        parent.add(post);
      }
      const header = new THREE.Mesh(new THREE.BoxGeometry(horizontal ? doorWidth : 0.12, 0.1, horizontal ? 0.12 : doorWidth), frame);
      header.position.set(horizontal ? doorCenter : fixed, h - 0.02, horizontal ? fixed : doorCenter);
      parent.add(header);
    }
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(horizontal ? max - min : 0.05, 0.05, horizontal ? 0.05 : max - min), mat(accent, { emissive: accent, emissiveIntensity: 0.25 }));
    stripe.position.set(horizontal ? (min + max) / 2 : fixed, 0.16, horizontal ? fixed : (min + max) / 2);
    parent.add(stripe);
  }

  const environmentData = DATA.environment || {};
  const query = new URLSearchParams(location.search);
  const forcedHour = query.get("hour") !== null ? Number(query.get("hour")) : null;
  let manualWeather = query.get("weather");
  let currentWeather = manualWeather || environmentData.weather || "sunny";
  let currentPhase = environmentData.phase || "day";
  const environmentEl = document.getElementById("environment");

  function singaporeClock() {
    if (forcedHour !== null) {
      return { hour: forcedHour, text: `${String(forcedHour).padStart(2, "0")}:00` };
    }
    const parts = new Intl.DateTimeFormat("en-SG", {
      timeZone: "Asia/Singapore", hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(new Date());
    const hour = Number(parts.find((part) => part.type === "hour")?.value || 12);
    const minute = parts.find((part) => part.type === "minute")?.value || "00";
    return { hour, text: `${String(hour).padStart(2, "0")}:${minute}` };
  }

  function phaseForHour(hour) {
    if (hour >= 5 && hour < 7) return "dawn";
    if (hour >= 7 && hour < 17) return "day";
    if (hour >= 17 && hour < 20) return "dusk";
    return "night";
  }

  function applyEnvironment() {
    const clock = singaporeClock();
    currentPhase = phaseForHour(clock.hour);
    const rain = currentWeather === "rain";
    const cloudy = currentWeather === "cloudy";
    const night = currentPhase === "night";
    const dusk = currentPhase === "dusk" || currentPhase === "dawn";
    let bg = 0xdcefff;
    if (night) bg = 0x050a17;
    else if (dusk) bg = 0x9b7f9f;
    else if (rain) bg = 0x8fa0b3;
    else if (cloudy) bg = 0xb9c8d8;
    scene.background.setHex(bg);
    scene.fog.color.setHex(bg);
    scene.fog.near = night ? 92 : 105;
    scene.fog.far = night ? 210 : 235;
    hemi.intensity = night ? 0.22 : dusk ? 0.62 : rain ? 0.68 : 0.9;
    ambient.intensity = night ? 0.08 : dusk ? 0.20 : 0.28;
    sun.intensity = night ? 0.03 : dusk ? 0.58 : rain ? 0.35 : cloudy ? 0.85 : 1.65;
    sun.color.setHex(night ? 0x93c5fd : dusk ? 0xffb27d : 0xfff1d2);
    fill.intensity = night ? 0.18 : rain ? 0.24 : 0.46;
    allLight.visible = true;
    allLight.intensity = night ? 0.22 : dusk ? 0.55 : 0.35;
    renderer.toneMappingExposure = night ? 0.82 : dusk ? 0.86 : rain ? 0.86 : 0.95;
    for (const lamp of artificialLights) {
      lamp.light.intensity = lamp.base * (night ? 2.0 : dusk ? 1.35 : rain ? 1.1 : 0.45);
    }
    for (const pane of skyPanes) {
      pane.material.map = makeSkyTexture(currentPhase, currentWeather);
      pane.material.needsUpdate = true;
    }
    const temperature = environmentData.temperature_c != null ? ` | ${environmentData.temperature_c.toFixed(1)} C` : "";
    const source = environmentData.source === "open-meteo" ? "" : " | offline weather";
    environmentEl.textContent = `${clock.text} Singapore | ${currentPhase} | ${currentWeather}${temperature}${source}`;
    const weatherButton = document.getElementById("toggleWeather");
    if (weatherButton) weatherButton.textContent = `Weather: ${manualWeather ? currentWeather : "Auto"}`;
  }

  document.getElementById("toggleWeather").addEventListener("click", () => {
    const order = ["sunny", "cloudy", "rain"];
    const at = order.indexOf(currentWeather);
    manualWeather = order[(at + 1) % order.length];
    currentWeather = manualWeather;
    applyEnvironment();
  });
  setInterval(() => { if (forcedHour === null) applyEnvironment(); }, 60000);

  const info = document.getElementById("info");

  const ctxSpark = infoSpark.getContext("2d");

  function drawSpark(agent) {
    const w = infoSpark.width, h = infoSpark.height;
    ctxSpark.clearRect(0, 0, w, h);
    ctxSpark.fillStyle = "rgba(148,163,184,.12)"; ctxSpark.fillRect(0, 0, w, h);
    const values = agent.spark && agent.spark.length > 1 ? agent.spark : [1, 1];
    let min = Math.min(...values), max = Math.max(...values);
    if (max - min < 1e-9) { min -= 0.5; max += 0.5; }
    ctxSpark.strokeStyle = agent.accent; ctxSpark.lineWidth = 4; ctxSpark.beginPath();
    values.forEach((v, i) => {
      const x = 10 + (i / Math.max(1, values.length - 1)) * (w - 20);
      const y = h - 10 - ((v - min) / (max - min)) * (h - 24);
      if (i === 0) ctxSpark.moveTo(x, y); else ctxSpark.lineTo(x, y);
    });
    ctxSpark.stroke();
  }

  function showAgent(agent) {
    info.classList.add("show");

    const manager = squad && byId[squad.manager] ? byId[squad.manager].name : (agent.manager && byId[agent.manager] ? byId[agent.manager].name : "Board");
    const rows = [
      ["Paper equity", agent.equity ? `$${Number(agent.equity).toLocaleString(undefined, { maximumFractionDigits: 2 })}` : "—"],
      ["Return", agent.pnl_pct ? `${(Number(agent.pnl_pct) * 100).toFixed(2)}%` : "—"],
      ["Squad", squad ? squad.name : agent.squad || "—"],

      ["Floor", floors[agent.floor]?.short || "—"],
      ["Status", agent.status],

    for (const [k, v] of rows) {
      const kk = document.createElement("span"); kk.textContent = k;
      const vv = document.createElement("span"); vv.textContent = v;
      infoKv.append(kk, vv);
    }
    drawSpark(agent);

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let hovered = null;
  function hitAt(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(agentGroups, true);
    if (!hits.length) return null;
    let node = hits[0].object;
    while (node && !node.userData.agentId) node = node.parent;
    return node ? byId[node.userData.agentId] : null;
  }
  renderer.domElement.addEventListener("pointermove", (event) => {
    const agent = hitAt(event.clientX, event.clientY);
    if (agent !== hovered) { hovered = agent; renderer.domElement.style.cursor = agent ? "pointer" : "grab"; }
  });
  renderer.domElement.addEventListener("pointerup", (event) => {
    if (event.button !== 0) return;
    const agent = hitAt(event.clientX, event.clientY);
    if (agent) showAgent(agent);
  });

    event.currentTarget.textContent = labelsVisible ? "Hide labels" : "Show labels";
  });
  document.getElementById("resetView").addEventListener("click", () => { if (allMode) focusAllFloors(); else focusFloor(currentFloor); applyEnvironment(); });
  window.addEventListener("keydown", (event) => { if (event.key === "Escape") info.classList.remove("show"); });

  const clock = new THREE.Clock();
  const moveTarget = new THREE.Vector3();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.getElapsedTime();
    for (const obj of agentObjects) {
      if (!obj.person) continue;
      const p = obj.person;
      const active = obj.agent.status === "active";
      const roaming = (obj.agent.status === "idle" || obj.agent.status === "offline") && obj.waypoints.length > 0;
      let walking = false;

      if (roaming) {
        if (t > obj.waitUntil && p.group.position.distanceTo(obj.target) < 0.18) {
          const next = obj.waypoints[Math.floor(Math.random() * obj.waypoints.length)];
          obj.target.copy(next);
          obj.waitUntil = t + 3.0 + Math.random() * 5.0;
        }
        moveTarget.copy(obj.target).sub(p.group.position);
        moveTarget.y = 0;
        const distance = moveTarget.length();
        if (distance > 0.08) {
          const step = Math.min(distance, obj.moveSpeed * dt);
          moveTarget.normalize();
          p.group.position.addScaledVector(moveTarget, step);
          p.group.rotation.y = Math.atan2(moveTarget.x, moveTarget.z);
          walking = true;
        } else if (t > obj.waitUntil) {
          obj.waitUntil = t + 2.0 + Math.random() * 4.0;
        }
      } else {
        moveTarget.copy(obj.home).sub(p.group.position);
        moveTarget.y = 0;
        const distance = moveTarget.length();
        if (distance > 0.04) {
          const step = Math.min(distance, 1.5 * dt);
          moveTarget.normalize();
          p.group.position.addScaledVector(moveTarget, step);
          p.group.rotation.y = Math.atan2(moveTarget.x, moveTarget.z);
          walking = true;
        } else {
          p.group.position.copy(obj.home);
          p.group.rotation.y = 0;
        }
      }

      const stride = walking ? Math.sin(t * 9.0 + obj.phase) : 0;
      p.group.position.y = 0.11 + (walking ? Math.abs(Math.sin(t * 9.0 + obj.phase)) * 0.035 : 0);
      p.legL.rotation.x = stride * 0.5;
      p.legR.rotation.x = -stride * 0.5;
      p.head.position.y = p.headY + Math.sin(t * 1.7 + obj.phase) * 0.012;
      if (walking) {
        p.armL.rotation.x = -0.3 + stride * 0.55;
        p.armR.rotation.x = -0.3 - stride * 0.55;
      } else {
        p.armL.rotation.x = -1.0 + Math.sin(t * 4.5 + obj.phase) * (active ? 0.18 : 0.04);
        p.armR.rotation.x = -1.0 + Math.cos(t * 4.5 + obj.phase) * (active ? 0.18 : 0.04);
      }
      if (obj.ring) {
        const pulse = 1 + Math.sin(t * 2.0 + obj.phase) * (active ? 0.06 : 0.02);
        obj.ring.scale.setScalar(pulse);
        obj.ring.material.opacity = active ? 0.72 + Math.sin(t * 2 + obj.phase) * 0.12 : 0.45;
      }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
  });

  focusFloor(1);
  applyEnvironment();
  animate();
})();
  </script>
</body>
</html>
