# LIVE spot crypto — requires exchange keys and sandbox=false.
# Binance.com is NOT available to US persons. If you are in the US, use a
# regulated venue (Kraken/Coinbase) and adjust symbols/quote_currency.
# This config is an example, not a recommendation of a venue.
# Start with small capital; disable withdrawals on the API key.

data:
  source: binance
  market: spot
  interval: 1d
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - ADAUSDT
    - DOGEUSDT
    - LINKUSDT
  start: "2020-01"
  end: null
  bars_path: data/normalized/bars_live_crypto.parquet
  raw_dir: data/raw
  use_cache: true
  verify_checksums: true
  include_recent: true
  recent_limit: 30

strategy:
  name: trend
  trend:
    lookback: 200
    vol_window: 60
    target_vol: 0.12
    max_weight: 0.15
    long_short: false
    rebalance: W
    max_gross: 1.0
    vol_target: true
  xsmom:
    lookback: 60
    skip: 7
    top_quantile: 0.30
    bottom_quantile: 0.30
    long_short: false
    max_weight: 0.12
    rebalance: W
    max_gross: 1.0
    vol_target: true
    target_vol: 0.15
    vol_window: 30
    min_assets: 5

backtest:
  initial_capital: 5000
  cost_bps: 10
  slippage_bps: 10
  periods_per_year: 365
  execution_lag: 1
  risk_free_rate: 0.0
  output_dir: artifacts

risk:
  max_gross: 1.0
  max_net: 1.0
  max_asset_weight: 0.15
  max_drawdown: 0.20
  min_cash_weight: 0.0
  kill_switch_file: artifacts/KILL_LIVE_CRYPTO
  state_path: artifacts/risk_state_live_crypto.json
  auto_kill_on_drawdown: true

broker:
  name: ccxt
  paper: false
  exchange: binance
  sandbox: false
  quote_currency: USDT
  allow_short: false
  initial_cash: 5000
  min_notional: 10
  journal_path: artifacts/orders_live_crypto.sqlite
  order_state_path: artifacts/order_state_live_crypto.sqlite
  state_path: artifacts/paper_state_live_crypto.json
  performance_path: artifacts/performance_live_crypto.jsonl
  heartbeat_path: artifacts/heartbeat_live_crypto.json

seed: 7
