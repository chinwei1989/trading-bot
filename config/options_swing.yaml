# Deterministic BTC/ETH swing-options paper lane.
# Long premium only. Separate account and artifacts from all other lanes.
# No live broker is configured.

data:
  source: binance
  market: spot
  interval: 1d
  symbols:
    - BTCUSDT
    - ETHUSDT
  start: "2020-01"
  end: null
  universe_path: config/pit_universe_crypto.csv
  bars_path: data/normalized/bars.parquet
  raw_dir: data/raw
  use_cache: true
  verify_checksums: true
  include_recent: true
  recent_limit: 30

strategy:
  name: trend
  trend:
    lookback: 200
    vol_window: 60
    target_vol: 0.15
    max_weight: 0.20
    long_short: false
    rebalance: D
    max_gross: 1.0
    vol_target: true

backtest:
  initial_capital: 10000
  cost_bps: 10
  slippage_bps: 5
  periods_per_year: 365
  execution_lag: 1
  risk_free_rate: 0.0
  output_dir: artifacts/options_swing

risk:
  max_gross: 0.80
  max_net: 0.80
  max_asset_weight: 0.20
  max_drawdown: 0.25
  min_cash_weight: 0.20
  kill_switch_file: artifacts/options_swing/KILL
  state_path: artifacts/options_swing/risk_state.json
  auto_kill_on_drawdown: true

broker:
  name: paper
  paper: true
  exchange: deribit
  sandbox: true
  quote_currency: USD
  allow_short: false
  initial_cash: 10000
  min_notional: 10
  journal_path: artifacts/options_swing/orders.sqlite
  order_state_path: artifacts/options_swing/order_state.sqlite
  state_path: artifacts/options_swing/paper_state.json
  performance_path: artifacts/options_swing/performance.jsonl
  heartbeat_path: artifacts/options_swing/heartbeat.json

agent:
  enabled: false
  provider: deterministic
  paper_only: true

swing:
  min_dte: 21
  max_dte: 45
  exit_dte: 7
  target_delta_min: 0.40
  target_delta_max: 0.60
  max_spread_pct: 0.05
  min_open_interest: 100
  profit_target_pct: 0.50
  stop_loss_pct: 0.50
  max_holding_days: 20
  max_contracts: 1
  max_premium_per_trade_pct: 0.02
  max_total_premium_pct: 0.05
  min_cash_pct: 0.20
  max_open_legs: 2
  max_legs_per_underlying: 1
  fee_bps: 3.0

seed: 7
