# 30-minute AI options paper lane.
#
# The AI squad produces direction on 30m underlying bars. A deterministic
# selector maps long -> call and short -> put. Only long premium is supported.
# This account is separate from the daily AI spot account and the hourly
# deterministic meta account. No live broker is configured.

data:
  source: binance
  market: spot
  interval: 30m
  symbols:
    - BTCUSDT
    - ETHUSDT
  start: "2026-09"
  end: null
  universe_path: config/pit_universe_crypto.csv
  bars_path: data/normalized/bars_ai_options_30m.parquet
  raw_dir: data/raw_intraday
  use_cache: true
  verify_checksums: true
  include_recent: true
  recent_limit: 1000

strategy:
  name: trend
  trend:
    lookback: 200
    vol_window: 60
    target_vol: 0.15
    max_weight: 0.20
    long_short: false
    rebalance: H
    max_gross: 0.80
    vol_target: true

backtest:
  initial_capital: 10000
  cost_bps: 10
  slippage_bps: 5
  periods_per_year: 17520
  execution_lag: 1
  risk_free_rate: 0.0
  output_dir: artifacts/ai_options_30m

risk:
  max_gross: 0.80
  max_net: 0.80
  max_asset_weight: 0.20
  max_drawdown: 0.25
  min_cash_weight: 0.20
  kill_switch_file: artifacts/ai_options_30m/KILL
  state_path: artifacts/ai_options_30m/risk_state.json
  auto_kill_on_drawdown: true

broker:
  name: paper
  paper: true
  exchange: deribit
  sandbox: true
  quote_currency: USDT
  allow_short: false
  initial_cash: 10000
  min_notional: 10
  journal_path: artifacts/ai_options_30m/orders.sqlite
  order_state_path: artifacts/ai_options_30m/order_state.sqlite
  state_path: artifacts/ai_options_30m/paper_state.json
  performance_path: artifacts/ai_options_30m/performance.jsonl
  heartbeat_path: artifacts/ai_options_30m/heartbeat.json

agent:
  enabled: true
  provider: squad
  model: jev-latest
  endpoint: https://api.typesafe.ai/v1/systemone
  api_key_env: TYPESAFE_API_KEY
  artifacts_dir: artifacts/ai_options_30m
  timeout_seconds: 30
  max_retries: 2
  temperature: 0.0
  max_tokens: 1200
  fallback: none
  paper_only: true
  include_macro: true
  include_sentiment: true
  policy:
    max_gross: 0.80
    max_asset_weight: 0.20
    min_cash_weight: 0.20
    max_turnover: 0.02
    min_confidence: 0.60
    target_vol: 0.15
    risk_off_gross: 0.25
    allow_short: true

seed: 7
