# Meta allocator across four sleeves. One combined paper account.
data:
  source: binance
  market: spot
  interval: 1d
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - ADAUSDT
    - DOGEUSDT
    - LINKUSDT
    - SUIUSDT
  start: "2020-01"
  end: null
  universe_path: config/pit_universe_crypto.csv
  bars_path: data/normalized/bars.parquet
  raw_dir: data/raw
  use_cache: true
  verify_checksums: true
  include_recent: true
  recent_limit: 30

strategy:
  name: meta
  trend:
    lookback: 200
    vol_window: 60
    target_vol: 0.15
    max_weight: 0.20
    long_short: false
    rebalance: W
    max_gross: 1.0
    vol_target: true
  xsmom:
    lookback: 60
    skip: 7
    top_quantile: 0.30
    bottom_quantile: 0.30
    long_short: false
    max_weight: 0.15
    rebalance: W
    max_gross: 1.0
    vol_target: true
    target_vol: 0.20
    vol_window: 30
    min_assets: 5
  breakout:
    lookback: 55
    exit_lookback: 20
    atr_window: 20
    atr_stop: 2.0
    risk_per_trade: 0.02
    vol_window: 60
    target_vol: 0.15
    max_weight: 0.20
    long_short: false
    rebalance: W
    max_gross: 1.0
    vol_target: true
    volume_filter: true
    volume_window: 20
    volume_multiplier: 1.0
  reversal:
    lookback: 20
    entry_z: 2.0
    exit_z: 0.0
    rsi_window: 2
    rsi_entry: 5.0
    rsi_exit: 60.0
    regime_lookback: 200
    regime_filter: true
    vol_window: 20
    target_vol: 0.10
    max_weight: 0.10
    long_short: false
    rebalance: D
    max_gross: 0.50
    vol_target: true
  meta:
    sleeves:
      trend: 0.40
      breakout: 0.30
      reversal: 0.15
      xsmom: 0.15
    lookback: 90
    min_history: 30
    rebalance: W
    max_sleeve_weight: 0.60
    max_asset_weight: 0.25
    max_gross: 0.80
    target_vol: 0.12
    vol_window: 60
    vol_target: true
    correlation_penalty: true

backtest:
  initial_capital: 10000
  cost_bps: 10
  slippage_bps: 5
  periods_per_year: 365
  execution_lag: 1
  risk_free_rate: 0.0
  output_dir: artifacts

risk:
  max_gross: 0.80
  max_net: 0.80
  max_asset_weight: 0.25
  max_drawdown: 0.30
  min_cash_weight: 0.20
  kill_switch_file: artifacts/KILL_meta
  state_path: artifacts/risk_state_meta.json
  auto_kill_on_drawdown: true

broker:
  name: paper
  paper: true
  exchange: kraken
  sandbox: true
  quote_currency: USDT
  allow_short: false
  initial_cash: 10000
  min_notional: 10
  journal_path: artifacts/orders_meta.sqlite
  order_state_path: artifacts/order_state_meta.sqlite
  state_path: artifacts/paper_state_meta.json
  performance_path: artifacts/performance_meta.jsonl
  heartbeat_path: artifacts/heartbeat_meta.json

seed: 7
