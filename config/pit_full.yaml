  recent_limit: 30
strategy:
  name: meta
  trend:
    lookback: 200
    vol_window: 60
    target_vol: 0.15
    max_weight: 0.2
    long_short: false
    rebalance: W
    max_gross: 1.0
    vol_target: true
  xsmom:
    lookback: 60
    skip: 7
    top_quantile: 0.3
    bottom_quantile: 0.3
    long_short: false
    max_weight: 0.15
    rebalance: W
    max_gross: 1.0
    vol_target: true
    target_vol: 0.2
    vol_window: 30
    min_assets: 5
  breakout:
    lookback: 55
    exit_lookback: 20
    atr_window: 20
    atr_stop: 2.0
    risk_per_trade: 0.02
    vol_window: 60
    target_vol: 0.15
    max_weight: 0.2
    long_short: false
    rebalance: W
    max_gross: 1.0
    vol_target: true
    volume_filter: true
    volume_window: 20
    volume_multiplier: 1.0
  reversal:
    lookback: 20
    entry_z: 2.0
    exit_z: 0.0
    rsi_window: 2
    rsi_entry: 5.0
    rsi_exit: 60.0
    regime_lookback: 200
    regime_filter: true
    vol_window: 20
    target_vol: 0.1
    max_weight: 0.1
    long_short: false
    rebalance: D
    max_gross: 0.5
    vol_target: true
  meta:
    sleeves:
      trend: 0.4
      breakout: 0.3
      reversal: 0.15
      xsmom: 0.15
    lookback: 90
    min_history: 30
    rebalance: W
    max_sleeve_weight: 0.6
    max_asset_weight: 0.25
    max_gross: 0.8
    target_vol: 0.12
    vol_window: 60
    vol_target: true
    correlation_penalty: true
backtest:
  initial_capital: 10000
  cost_bps: 10
  slippage_bps: 5
  periods_per_year: 365
  execution_lag: 1
  risk_free_rate: 0.0
  output_dir: artifacts/pit_full
risk:
  max_gross: 0.8
  max_net: 0.8
  max_asset_weight: 0.25
  max_drawdown: 0.3
  min_cash_weight: 0.2
  kill_switch_file: artifacts/pit_full/KILL
  state_path: artifacts/pit_full/risk_state.json
  auto_kill_on_drawdown: true
broker:
  name: paper
  paper: true
  exchange: kraken
  sandbox: true
  quote_currency: USDT
  allow_short: false
  initial_cash: 10000
  min_notional: 10
  journal_path: artifacts/pit_full/orders.sqlite
  order_state_path: artifacts/pit_full/order_state.sqlite
  state_path: artifacts/pit_full/paper_state.json
  performance_path: artifacts/pit_full/performance.jsonl
  heartbeat_path: artifacts/pit_full/heartbeat.json
seed: 7
