backtest:
  cost_bps: 10
  execution_lag: 1
  initial_capital: 10000
  output_dir: artifacts/pit_lite_xsmom
  periods_per_year: 365
  risk_free_rate: 0.0
  slippage_bps: 5
broker:
  allow_short: false
  exchange: kraken
  heartbeat_path: artifacts/pit_lite_xsmom/heartbeat.json
  initial_cash: 10000
  journal_path: artifacts/pit_lite_xsmom/orders.sqlite
  min_notional: 10
  name: paper
  order_state_path: artifacts/pit_lite_xsmom/order_state.sqlite
  paper: true
  performance_path: artifacts/pit_lite_xsmom/performance.jsonl
  quote_currency: USDT
  sandbox: true
  state_path: artifacts/pit_lite_xsmom/paper_state.json
data:
  bars_path: data/normalized/bars_pit_lite.parquet
  end: null
  include_recent: true
  interval: 1d
  market: spot
  raw_dir: data/raw
  recent_limit: 30
  source: binance
  start: 2017-08
  symbols:
  - ADAUSDT
  - AGIXUSDT
  - APTUSDT
  - ARBUSDT
  - ATOMUSDT
  - AVAXUSDT
  - BCHUSDT
  - BNBUSDT
  - BONKUSDT
  - BTCUSDT
  - CHZUSDT
  - CYBERUSDT
  - DOGEUSDT
  - DOGSUSDT
  - DOTUSDT
  - ENJUSDT
  - EOSUSDT
  - ETCUSDT
  - ETHUSDT
  - FILUSDT
  - FLOKIUSDT
  - FTMUSDT
  - GALAUSDT
  - GMTUSDT
  - HIFIUSDT
  - HOOKUSDT
  - JASMYUSDT
  - LINKUSDT
  - LTCUSDT
  - MATICUSDT
  - NOTUSDT
  - OPUSDT
  - ORDIUSDT
  - PEPEUSDT
  - SANDUSDT
  - SHIBUSDT
  - SOLUSDT
  - SUIUSDT
  - TAOUSDT
  - TIAUSDT
  - TRBUSDT
  - TRXUSDT
  - UNIUSDT
  - VETUSDT
  - WAVESUSDT
  - WIFUSDT
  - WLDUSDT
  - WLFIUSDT
  - XRPUSDT
  - ZECUSDT
  - ZILUSDT
  universe_path: config/pit_universe_lite.csv
  use_cache: true
  verify_checksums: true
risk:
  auto_kill_on_drawdown: true
  kill_switch_file: artifacts/pit_lite_xsmom/KILL
  max_asset_weight: 0.25
  max_drawdown: 0.3
  max_gross: 0.8
  max_net: 0.8
  min_cash_weight: 0.2
  state_path: artifacts/pit_lite_xsmom/risk_state.json
seed: 7
strategy:
  breakout:
    atr_stop: 2.0
    atr_window: 20
    exit_lookback: 20
    long_short: false
    lookback: 55
    max_gross: 1.0
    max_weight: 0.2
    rebalance: W
    risk_per_trade: 0.02
    target_vol: 0.15
    vol_target: true
    vol_window: 60
    volume_filter: true
    volume_multiplier: 1.0
    volume_window: 20
  meta:
    correlation_penalty: true
    lookback: 90
    max_asset_weight: 0.15
    max_gross: 0.8
    max_sleeve_weight: 0.6
    min_history: 30
    rebalance: M
    sleeves:
      xsmom: 1.0
    target_vol: 0.12
    vol_target: true
    vol_window: 60
    no_trade_band: 0.02
    max_asset_vol: 1.5
  name: meta
  reversal:
    entry_z: 2.0
    exit_z: 0.0
    long_short: false
    lookback: 20
    max_gross: 0.5
    max_weight: 0.1
    rebalance: D
    regime_filter: true
    regime_lookback: 200
    rsi_entry: 5.0
    rsi_exit: 60.0
    rsi_window: 2
    target_vol: 0.1
    vol_target: true
    vol_window: 20
  trend:
    long_short: false
    lookback: 200
    max_gross: 1.0
    max_weight: 0.2
    rebalance: W
    target_vol: 0.15
    vol_target: true
    vol_window: 60
  xsmom:
    bottom_quantile: 0.3
    long_short: false
    lookback: 60
    max_gross: 1.0
    max_weight: 0.15
    min_assets: 5
    rebalance: W
    skip: 7
    target_vol: 0.2
    top_quantile: 0.3
    vol_target: true
    vol_window: 30
